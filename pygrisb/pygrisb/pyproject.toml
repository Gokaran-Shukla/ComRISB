[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygrisb"
version = "2026.10.0"
description = "Python libraries for the CyGutz / ComRISB (G)RISB package"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Yongxin Yao" }, { name = "Nicola Lanata" }, { name = "Xiaoyu Deng" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.0",
    "mpi4py>=3.1",
    "matplotlib",
    "sympy",
    "inquirer",
    "ase",
    "pymatgen-core",
    "tabulate",
    "spglib",
]

[project.optional-dependencies]
# quantum-computing embedding solver (gsolver/hdecomp.py)
quantum = ["qiskit", "openfermion"]
# only used by one symmetry test
phonopy = ["phonopy"]

[tool.setuptools.packages.find]
include = ["pygrisb*"]
